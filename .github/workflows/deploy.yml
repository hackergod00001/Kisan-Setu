name: Kisan-Setu Deployment Pipeline

on:
  push:
    branches: [ dev, staging, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  AWS_REGION: 'ap-south-1'

jobs:
  # ============================================================================
  # Build Lambda Layer Job
  # ============================================================================
  build-layer:
    name: Build Common Library Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Lambda Layer
        working-directory: ./kisan-setu-mvp
        run: |
          chmod +x build_common_layer.sh
          ./build_common_layer.sh

      - name: Upload Lambda Layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layer
          path: kisan-setu-mvp/lambda/.layer-build/
          retention-days: 1

  # ============================================================================
  # Deploy to Dev Environment
  # ============================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-layer]
    if: github.ref == 'refs/heads/dev'
    environment:
      name: development
      url: https://dev.kisan-setu.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda Layer
        uses: actions/download-artifact@v4
        with:
          name: lambda-layer
          path: kisan-setu-mvp/lambda/.layer-build/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Bootstrap (if needed)
        working-directory: ./kisan-setu-mvp
        run: |
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} || true

      - name: Deploy to Dev
        working-directory: ./kisan-setu-mvp
        run: |
          cdk deploy --context environment=dev --require-approval never

      - name: Post-deployment verification
        working-directory: ./kisan-setu-mvp
        run: |
          echo "✅ Dev deployment completed"
          aws cloudformation describe-stacks \
            --stack-name KisanSetuMVPStack-dev \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].StackStatus' \
            --output text

  # ============================================================================
  # Deploy to Staging Environment
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-layer]
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.kisan-setu.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda Layer
        uses: actions/download-artifact@v4
        with:
          name: lambda-layer
          path: kisan-setu-mvp/lambda/.layer-build/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Staging
        working-directory: ./kisan-setu-mvp
        run: |
          cdk deploy --context environment=staging --require-approval never

      - name: Post-deployment verification
        working-directory: ./kisan-setu-mvp
        run: |
          echo "✅ Staging deployment completed"
          aws cloudformation describe-stacks \
            --stack-name KisanSetuMVPStack-staging \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].StackStatus' \
            --output text

  # ============================================================================
  # Deploy to Production Environment (with manual approval)
  # ============================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-layer]
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://kisan-setu.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda Layer
        uses: actions/download-artifact@v4
        with:
          name: lambda-layer
          path: kisan-setu-mvp/lambda/.layer-build/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create backup of production stack
        working-directory: ./kisan-setu-mvp
        run: |
          echo "📦 Creating backup of production stack..."
          aws cloudformation get-template \
            --stack-name KisanSetuMVPStack \
            --region ${{ env.AWS_REGION }} \
            --query 'TemplateBody' \
            > prod-backup-$(date +%Y%m%d-%H%M%S).json || true

      - name: Deploy to Production
        working-directory: ./kisan-setu-mvp
        run: |
          cdk deploy --context environment=prod --require-approval never

      - name: Post-deployment verification
        working-directory: ./kisan-setu-mvp
        run: |
          echo "✅ Production deployment completed"
          aws cloudformation describe-stacks \
            --stack-name KisanSetuMVPStack \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].StackStatus' \
            --output text

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          # Add SNS notification or Slack webhook here if needed

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          # Add SNS notification or Slack webhook here if needed

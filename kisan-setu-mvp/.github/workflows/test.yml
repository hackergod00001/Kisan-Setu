name: Kisan-Setu CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  AWS_REGION: 'ap-south-1'

jobs:
  # ============================================================================
  # Unit Tests Job
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout
      
      - name: Run unit tests with coverage
        working-directory: ./kisan-setu-mvp
        env:
          HYPOTHESIS_PROFILE: dev
        run: |
          pytest tests/ \
            -m "not integration and not slow and not e2e" \
            --cov=lambda \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=test-results/junit.xml \
            -n auto
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./kisan-setu-mvp/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: kisan-setu-mvp/test-results/
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: kisan-setu-mvp/htmlcov/

  # ============================================================================
  # Property-Based Tests Job
  # ============================================================================
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout
      
      - name: Run property-based tests (100 iterations)
        working-directory: ./kisan-setu-mvp
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/ \
            -m "property" \
            --tb=short \
            --timeout=300 \
            --junitxml=test-results/property-junit.xml
      
      - name: Upload property test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-test-results
          path: kisan-setu-mvp/test-results/
      
      - name: Upload Hypothesis examples
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hypothesis-examples
          path: kisan-setu-mvp/.hypothesis/

  # ============================================================================
  # Integration Tests Job (with LocalStack)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3,lambda,apigateway
          DEBUG: 1
          DATA_DIR: /tmp/localstack/data
        options: >-
          --health-cmd "awslocal dynamodb list-tables"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout awscli-local
      
      - name: Configure LocalStack
        run: |
          pip install awscli-local
          awslocal dynamodb create-table \
            --table-name KisanSetuData \
            --attribute-definitions \
              AttributeName=PK,AttributeType=S \
              AttributeName=SK,AttributeType=S \
            --key-schema \
              AttributeName=PK,KeyType=HASH \
              AttributeName=SK,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST
      
      - name: Run integration tests
        working-directory: ./kisan-setu-mvp
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          pytest tests/ \
            -m "integration" \
            --tb=short \
            --timeout=600 \
            --junitxml=test-results/integration-junit.xml
      
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: kisan-setu-mvp/test-results/

  # ============================================================================
  # Code Quality Job
  # ============================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy pylint
      
      - name: Run Black (code formatting check)
        working-directory: ./kisan-setu-mvp
        run: |
          black --check lambda/ tests/ || true
      
      - name: Run isort (import sorting check)
        working-directory: ./kisan-setu-mvp
        run: |
          isort --check-only lambda/ tests/ || true
      
      - name: Run flake8 (linting)
        working-directory: ./kisan-setu-mvp
        run: |
          flake8 lambda/ tests/ --max-line-length=120 --extend-ignore=E203,W503 || true
      
      - name: Run pylint
        working-directory: ./kisan-setu-mvp
        run: |
          pylint lambda/ --disable=C0111,R0903,R0913 --max-line-length=120 || true

  # ============================================================================
  # Security Scan Job
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: ./kisan-setu-mvp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety
      
      - name: Run Bandit (security linter)
        working-directory: ./kisan-setu-mvp
        run: |
          bandit -r lambda/ -f json -o bandit-report.json || true
      
      - name: Run Safety (dependency vulnerability check)
        working-directory: ./kisan-setu-mvp
        run: |
          safety check --json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: kisan-setu-mvp/*-report.json

  # ============================================================================
  # Test Summary Job
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, property-tests, integration-tests]
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results
      
      - name: Publish test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "test-results/**/*.xml"
      
      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const comment = `## Test Results Summary
            
            ✅ Unit Tests: Completed
            ✅ Property Tests: Completed  
            ✅ Integration Tests: Completed
            
            See workflow run for detailed results.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

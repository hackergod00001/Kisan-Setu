[pytest]
# Pytest configuration for Kisan-Setu

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Markers
markers =
    property: Property-based tests using Hypothesis
    integration: Integration tests requiring AWS services
    slow: Slow-running tests
    mock: Tests using mock services
    unit: Unit tests (default)
    e2e: End-to-end tests

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=lambda --cov-report=html --cov-report=term
[coverage:run]
source = lambda
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Fail if coverage is below 80%
fail_under = 80

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
